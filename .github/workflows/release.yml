name: Release

on:
  pull_request:
    types: [closed]
    branches: [release]
    # Prevents the bot's own artifacthub-pkg.yml update PR (below) from
    # re-triggering this job. Belt and suspenders: the "already released"
    # check further down is keyed on package.json's version, which that PR
    # never touches, so it would harmlessly skip anyway.
    paths-ignore:
      - artifacthub-pkg.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Build, package, and publish a GitHub release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists - skipping release (bump package.json's version to publish a new one)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      - name: Package
        if: steps.check.outputs.exists == 'false'
        run: npm run package

      - name: Compute checksum
        id: checksum
        if: steps.check.outputs.exists == 'false'
        run: |
          # Discovered, not hardcoded: `npm run package` derives the tarball
          # filename from package.json's "name" field, sanitizing scoped
          # names like "@user/pkg" into "user-pkg" - don't assume the exact
          # sanitization rule, just find the one tarball that exists.
          TARBALL=$(ls -1 *.tar.gz | head -n1)
          CHECKSUM=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "filename=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release with changelog and tarball
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            *.tar.gz \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Update artifacthub-pkg.yml
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ steps.checksum.outputs.filename }}
          CHECKSUM: ${{ steps.checksum.outputs.sha256 }}
        run: node .github/scripts/sync-artifacthub-pkg.mjs

      - name: Open a PR to sync artifacthub-pkg.yml
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="bot/sync-artifacthub-pkg-${{ steps.version.outputs.tag }}"
          git checkout -b "$BRANCH"
          git add artifacthub-pkg.yml
          git commit -m "chore: sync artifacthub-pkg.yml to ${{ steps.version.outputs.tag }}"
          git push origin "$BRANCH"

          cat <<'EOF' > /tmp/pr-body.md
          Updates `artifacthub-pkg.yml`'s version, timestamp, archive URL, and checksum to match the just-published release.

          **Note:** this PR was opened using the workflow's default token, so its required status checks (CI, CodeQL) won't run automatically - that's a GitHub Actions limitation (`GITHUB_TOKEN`-triggered pushes don't trigger other workflows), not a problem with this change. The diff is a predictable, mechanical metadata update. Merge with the admin bypass-merge option, or push an empty commit of your own to this branch first if you'd rather see the checks run.
          EOF

          gh pr create \
            --base release \
            --head "$BRANCH" \
            --title "chore: sync artifacthub-pkg.yml to ${{ steps.version.outputs.tag }}" \
            --body-file /tmp/pr-body.md
